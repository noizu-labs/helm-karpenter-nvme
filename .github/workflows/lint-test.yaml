name: Lint and Test
on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.tpl'
      - '**/*.json'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint . -f tests/test-values.yaml

      - name: Helm template
        run: helm template test-release . -f tests/test-values.yaml
