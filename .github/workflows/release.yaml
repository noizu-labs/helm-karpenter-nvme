name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package .

      - name: Push to GHCR
        run: helm push karpenter-nvme-*.tgz oci://ghcr.io/noizu-labs
